<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="This is where your description goes">
	<meta name="keywords" content="one, two, three">

	<title>Title in the tab</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="lottery-container">
		<div>
			<img src="img/lotto.jpg">
		</div>

		<header>
			<h1>Click for your 6 lucky lottery numbers!!</h1>
			<h2>Luck of the draw! Click the white button to generate five numbers
				and the red button to generate one number.</h2>
			<h3>Good Luck! If you win, we're splitting it.</h3>
		</header>

		<div class="lotto-number-container">
			<h4 id="lottoTopLine"></h4>
			<h5 id="lottoBottomLine"></h5>
		</div>

		<div class="lotto_pick_buttons">
			<button class="white" id="rollFiveNum">Roll 5 numbers</button>
			<button class="red" id="rollOneNum">Roll 1 number </button>
		</div>

	</div>

	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
